<!doctype html>
<meta charset="utf-8">
<title>TermTone port check</title>
<style>body { font: 14px monospace; padding: 16px } td, th { padding: 2px 12px; text-align: right } td:first-child { text-align: left }</style>
<p>Each pad rendered by the site's playSound() in this browser and by the CLI, at volume 100. 1.000 is identical.</p>
<table><thead><tr><th>pad</th><th>sample correlation</th><th>10 ms envelope</th><th>energy, CLI / browser</th></tr></thead><tbody id="rows"></tbody></table>
<script src="/playSound.js"></script>
<script>
const PADS = ["click", "chime", "yes", "no", "bell", "error", "warn", "success", "deploy", "pass", "commit", "think"]

// The CLI seeds its noise with mulberry32(1), so the browser gets the same numbers
function mulberry32(seed) {
  let a = seed >>> 0
  return () => {
    a = (a + 0x6d2b79f5) >>> 0
    let t = a
    t = Math.imul(t ^ (t >>> 15), t | 1)
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61)
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296
  }
}
function corr(a, b) {
  const n = Math.min(a.length, b.length)
  let ma = 0, mb = 0
  for (let i = 0; i < n; i++) { ma += a[i]; mb += b[i] }
  ma /= n; mb /= n
  let ab = 0, aa = 0, bb = 0
  for (let i = 0; i < n; i++) { const x = a[i] - ma, y = b[i] - mb; ab += x * y; aa += x * x; bb += y * y }
  return ab / Math.sqrt(aa * bb)
}
function envelope(s, w) {
  const out = []
  for (let i = 0; i < s.length; i += w) {
    let e = 0
    for (let j = i; j < Math.min(i + w, s.length); j++) e += s[j] * s[j]
    out.push(Math.sqrt(e / w))
  }
  return out
}
const energy = (s) => s.reduce((e, x) => e + x * x, 0)

;(async () => {
  for (const type of PADS) {
    const cli = new Float32Array(await (await fetch(`/pads/${type}.f32`)).arrayBuffer())
    const ctx = new OfflineAudioContext(1, cli.length, 44100)
    const random = Math.random
    Math.random = mulberry32(1)
    playSound(type, ctx, 1)
    Math.random = random
    const site = (await ctx.startRendering()).getChannelData(0)
    const row = [type, corr(cli, site), corr(envelope(cli, 441), envelope(site, 441)), energy(cli) / energy(site)]
    document.getElementById("rows").insertAdjacentHTML("beforeend",
      `<tr>${row.map((v) => `<td>${typeof v === "number" ? v.toFixed(3) : v}</td>`).join("")}</tr>`)
  }
  document.title = "done"
})()
</script>
